<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Fashion Trend Analyzer 💖</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Raleway&display=swap" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(to bottom, #ffe6f0, #ffffff);
            font-family: 'Raleway', sans-serif;
            color: #88314b;
            text-align: center;
            padding: 30px;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            color: #d6336c;
            font-size: 3em;
            margin-bottom: 0.3em;
        }

        .floral {
            background-image: url('https://i.imgur.com/og2qLMT.png');
            background-repeat: repeat;
            border: 5px double #f9a8c3;
            padding: 25px;
            border-radius: 20px;
            margin-bottom: 30px;
        }

        img {
            width: 80%;
            max-width: 700px;
            border: 4px solid #f4a1c2;
            border-radius: 15px;
            box-shadow: 0 0 12px rgba(255, 172, 201, 0.6);
            margin: 25px 0;
        }

        footer {
            margin-top: 40px;
            font-size: 0.9em;
            color: #aa4465;
        }
    </style>
</head>
<body>

    <h1>🌸 Fashion Trend Analyzer 🌸</h1>

    <div class="floral">
        <p><strong>Visual insights into the most fabulous fashion data 💅</strong></p>

        <img src="/static/top5_sales.png" alt="Top 5 Sales">
        <img src="/static/top5_ratings.png" alt="Top 5 Ratings">
        <img src="/static/sales_by_season.png" alt="Sales by Season">
        <img src="/static/popular_colors.png" alt="Popular Colors">
        <img src="/static/reviews_vs_rating.png" alt="Reviews vs Ratings">
        <img src="/static/price_distribution.png" alt="Price Distribution">
        <img src="/static/monthly_sales_trend.png" alt="Monthly Sales Trend">
    </div>

    <footer>
        🌷 Built with love by Harini 💗 | Powered by Flask & Python ✨
    </footer>
</body>
</html>
